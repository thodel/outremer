# nginx locations for the outremer MCP server (Epic 22, #131 — a root step).
# Paste inside the TLS server block of /etc/nginx/sites-enabled/tei.dh.unibe.ch,
# next to the other /mcp/<name>/ blocks. The server is mounted at the PUBLIC
# path (/mcp/outremer/mcp), so proxy_pass carries the URI through unchanged:
# no rewrite, no trailing slash. A mismatch between this location and
# OUTREMER_MCP_HTTP_PATH in the unit answers a bare Starlette "Not Found".

location = /mcp/outremer/health {
    proxy_pass http://127.0.0.1:8014/health;
}

location /mcp/outremer/mcp {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
    proxy_pass http://127.0.0.1:8014;
    proxy_redirect off;
}
