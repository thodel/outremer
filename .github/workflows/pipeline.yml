name: Pipeline (extract persons + build site data)

# Extraction moved to tei.dh.unibe.ch (2026-08-29): the nightly worker there
# runs inside the university network and reaches GPUStack, so it produces real
# model output. GitHub-hosted runners cannot reach GPUStack (403) and would
# silently regress the published corpus to heuristic NER — which is exactly
# what this workflow did until the tei move. Manual dispatch remains as an
# emergency fallback; its output is labelled by the honest engine provenance.
on:
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install from the lockfile: the nightly run must not silently pick up
      # new upstream releases. To bump deps deliberately, run
      # `pip install -r requirements.txt mistralai && pip freeze > requirements.lock.txt`
      # locally and commit the diff (mistralai = optional OCR fallback,
      # kept installed in the pipeline "just in case").
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run pipeline
        env:
          GPUSTACK_API_KEY: ${{ secrets.GPUSTACK_API_KEY }}
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python scripts/run_pipeline.py --llm-metadata

      # M9.4: score the fresh output against gold fixtures and append to the
      # eval history. Informational — a low score must not block publishing
      # (the CI workflow gates on fixture snapshots instead).
      - name: Evaluate against gold fixtures
        run: |
          python -m evaluation.harness --live \
            --append-history data/staging/eval_history.jsonl || true

      - name: Configure SSH for push
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:thodel/outremer.git

      - name: Commit generated artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/index.json site/data site/bib site/evidence bib data/entity_feedback.json data/evidence
          git add data/staging/eval_history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update extracted site data [skip ci]"
            git pull --rebase origin main
            git push
          fi
