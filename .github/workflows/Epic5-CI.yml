name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  PYTHON: '3.12'

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - run: pip install ruff
      - run: ruff check scripts/ tests/ --output-format=github

  test:
    name: Pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      # No silent fallback: if either install fails, the job must fail —
      # a swallowed install error previously left pytest missing entirely.
      # Runtime deps come from the lockfile so CI matches the nightly
      # pipeline exactly; bump deps by regenerating requirements.lock.txt.
      - run: pip install -r requirements.lock.txt
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/ -v
      # Offline evaluation over fixture snapshots.
      #
      # --min-agreement alone could not fail. The authority gold is
      # reject-dominated (7 accepts / 48 rejects), so a linker proposing
      # NOTHING scores 48/55 = 0.873 on authority and 0.9014 combined —
      # above the old 0.85 threshold. Authority linking could collapse
      # entirely and this gate would stay green.
      #
      # --min-lift gates on the weakest segment's lift over that null
      # baseline, which is the only part that is evidence the linker works.
      # Authority lift is +0.018 today, so 0.01 is a "do not get worse than
      # 2026-07-30" floor. RAISE IT once the gold repair (#98) and gold
      # growth (#36) land — with six of seven accepts currently linking the
      # wrong person, this number cannot yet be pushed higher honestly.
      - run: >
          python -m evaluation.harness --repeat 3
          --min-agreement 0.85 --min-lift 0.01

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Build and smoke-test on every PR and main push, so a broken Dockerfile
    # fails where it is introduced; push to GHCR only for version tags. The
    # Docker Hub job this replaces ran on tags alone and failed at login on its
    # only run (no credentials were ever configured) — the image was never
    # built, and nothing noticed for two months (#86).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: outremer:ci

      - name: Smoke test (scanned fixtures, no inference backend)
        # CI cannot reach GPUStack, so recognition has to fail softly: the run
        # completes, both documents are reported, and no engine is credited.
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          docker run --rm \
            -v "$PWD/tests/fixtures/scans:/in:ro" \
            -v "$RUNNER_TEMP/staging:/app/data/staging" \
            outremer:ci \
            --file /in/magna-carta-1215-image-only.pdf \
            --file /in/magna-carta-1215-incipit-hires.pdf
          python3 - <<'EOF'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "staging", "run_report.json")
          r = json.load(open(path))
          print({k: r.get(k) for k in ("docs_total", "docs_ok", "docs_failed")}, r.get("recognition"))
          assert r["docs_total"] == 2 and r["docs_failed"] == 0, r
          assert r["recognition"]["engines_used"] == {}, r["recognition"]
          EOF

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          for tag in "$VERSION" latest; do
            docker tag outremer:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
