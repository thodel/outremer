[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outremer"
version = "0.1.0"
description = "AI-assisted prosopography of the medieval Levant"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt (CI and Docker install from there).
dependencies = []

[project.optional-dependencies]
# The MCP server (Epic 22). mcp 2.0 renamed FastMCP to MCPServer and dropped
# mcp.server.fastmcp, so the major version is pinned deliberately. Not in the
# runtime lock: the pipeline does not need it, the server is its own service.
mcp = ["mcp>=2.0.0,<3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mcp>=2.0.0,<3",
]

[tool.setuptools]
packages = ["evaluation", "outremer_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
]
ignore = [
  "E402",  # import not at top of file (some scripts need conditional setup)
  "E501",  # line too long
  "E701",  # multiple statements on one line (used intentionally in kg scripts)
  "W293",  # blank line contains whitespace (cosmetic)
]

[tool.ruff.lint.per-file-ignores]
"scripts/test_llm_client.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "live_backend: requires access to a configured live inference backend",
]
